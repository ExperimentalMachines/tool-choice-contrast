name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Freeze gates check that recorded evidence commits are ancestors of HEAD.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      # The deterministic suite. Network and model marked tests are excluded:
      # a run that could not reach GitHub has not verified the vendor pin, and
      # saying so is the point of the marker.
      - run: uv run pytest -m "not network and not model"
      # The controls must reproduce their committed outcomes. A scorer change that moves a
      # control's verdict is a change to what every published number means.
      - run: uv run tcc controls --verify
      # A rebuild must reproduce both fingerprints, and the partition must reproduce both side
      # fingerprints. `tcc gates` is deliberately NOT run here yet: on the seed corpus G4 and G7
      # fail by design, and a CI step that is expected to fail teaches everyone to ignore it.
      # tests/verification/test_gates.py pins that expected state instead.
      - run: uv run tcc population build --verify
      - run: uv run tcc population partition --verify

  vendor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest tests/vendor -m network
